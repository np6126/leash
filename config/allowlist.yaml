#    ports: [443]

  # HTTP diagnostics
#  - host: httpbin.org
#    ports: [443, 80]

  # Container registries — clawx image pulls are routed through this proxy.
  # Restricted to the specific image paths used by the agent VM.
  - host: quay.io
    ports: [443]
    paths:
      - method: GET
        prefix: /v2/
      - method: HEAD
        prefix: /v2/fedora/fedora/

  # quay.io CDN — layer blob downloads are redirected here (pre-signed S3 URLs)
  - host: cdn01.quay.io
    ports: [443]
    paths:
      - method: GET
        prefix: /quayio-production-s3/

