# SECURITY NOTE — Log Viewer Allowlist Management
# The log viewer (port 8090) exposes API endpoints that can modify this file:
#   GET  /api/allowlist
#   POST /api/allowlist/add
#   POST /api/allowlist/remove
#
# Clients whose source IP falls within any network listed under agent_networks
# are blocked from those endpoints. Add all agent subnets here.

agent_networks:
  - 10.10.10.0/24

allowed_destinations:
  # Anthropic Claude API — restrict to inference and model listing only
