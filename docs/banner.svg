  </g>
  <text x="600" y="150" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="74" font-weight="700" letter-spacing="1" fill="#e8eaed">leash</text>
  <text x="600" y="192" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="24" fill="#8b9398">An auditing egress proxy for AI agents</text>
  <text x="600" y="227" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#7c86f5" letter-spacing="3">intercept &#183; audit &#183; enforce</text>
</svg>
