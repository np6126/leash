  <rect width="1200" height="300" rx="16" fill="#1c2333"/>
  <!-- enclosing brackets: the leash that holds the agent -->
  <g stroke="#7c86f5" stroke-width="5" fill="none" stroke-linecap="square">
    <path d="M110 85 H70 V235 H110"/>
